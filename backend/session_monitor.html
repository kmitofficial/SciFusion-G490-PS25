<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoAD Session Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.85);
      --accent: #38bdf8;
      --text: #e2e8f0;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      color: var(--text);
    }

    .card {
      width: min(960px, 100%);
      background: var(--panel);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    h1 {
      margin-top: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(1.8rem, 2vw + 1rem, 2.4rem);
      font-weight: 600;
    }

    h1 span {
      display: inline-flex;
      padding: 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      line-height: 1;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      align-items: end;
      margin-bottom: 24px;
    }

    label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(226, 232, 240, 0.7);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.35);
      color: inherit;
      font-size: 1rem;
      transition: border 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #0f172a;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(56, 189, 248, 0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      border-radius: 16px;
      background: rgba(148, 163, 184, 0.12);
      margin-bottom: 24px;
      border: 1px solid rgba(148, 163, 184, 0.15);
    }

    .status strong {
      font-size: 1.1rem;
    }

    .status span {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .stage {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .stage::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fbbf24;
      display: inline-block;
    }

    .stage[data-state="complete"]::before { background: #22c55e; }
    .stage[data-state="failed"]::before { background: #ef4444; }
    .stage[data-state="queued"]::before { background: #fbbf24; }

    .events {
      display: grid;
      gap: 12px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 12px;
    }

    .event {
      padding: 16px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      display: grid;
      gap: 6px;
    }

    .event header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: rgba(226, 232, 240, 0.75);
    }

    .event time {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
    }

    .event p {
      margin: 0;
      font-size: 1.05rem;
      color: #f8fafc;
    }

    .event small {
      color: rgba(148, 163, 184, 0.7);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
    }

    .error {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.2);
      color: #fecaca;
    }

    .result-list {
      margin: 0;
      padding-left: 18px;
      color: rgba(226, 232, 240, 0.85);
    }

    .result-list li {
      margin-bottom: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>⚡</span> AutoAD Session Monitor</h1>
    <div class="controls">
      <label>
        Session ID
        <input id="sessionId" type="text" placeholder="e.g. 27e5009a-a31f-4e27-817c-60c243990db4" />
      </label>
      <div>
        <button id="startBtn">Start Monitoring</button>
        <button id="stopBtn" disabled>Stop</button>
      </div>
    </div>

    <div class="status" id="statusPanel" hidden>
      <div>
        <strong>Stage:</strong>
        <span class="stage" id="stageLabel" data-state="queued">queued</span>
      </div>
      <div>
        <strong>Updated:</strong>
        <span id="updatedAt">–</span>
      </div>
    </div>

    <div id="results" hidden>
      <h2>Result Paths</h2>
      <ul class="result-list" id="resultList"></ul>
    </div>

    <div id="errorBanner" class="error" hidden></div>

    <section>
      <h2>Event Timeline</h2>
      <div class="events" id="events"></div>
    </section>
  </div>

  <script>
    const POLL_INTERVAL = 5000;
    const API_BASE = 'http://127.0.0.1:8000';

    const sessionIdInput = document.getElementById('sessionId');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const stageLabel = document.getElementById('stageLabel');
    const updatedAt = document.getElementById('updatedAt');
    const eventsContainer = document.getElementById('events');
    const errorBanner = document.getElementById('errorBanner');
    const statusPanel = document.getElementById('statusPanel');
    const resultsBlock = document.getElementById('results');
    const resultList = document.getElementById('resultList');

    let pollHandle = null;

    const prettyStage = stage => stage.replace(/_/g, ' ');

    const formatTimestamp = iso =>
      new Date(iso).toLocaleString(undefined, {
        hour12: false,
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

    const renderEvents = events => {
      eventsContainer.innerHTML = '';
      events
        .slice()
        .reverse()
        .forEach(event => {
          const node = document.createElement('article');
          node.className = 'event';
          node.innerHTML = `
            <header>
              <span>${prettyStage(event.stage)}</span>
              <time datetime="${event.timestamp}">${formatTimestamp(event.timestamp)}</time>
            </header>
            <p>${event.message}</p>
            ${Object.keys(event.metadata || {}).length ? `<small>${JSON.stringify(event.metadata, null, 2)}</small>` : ''}
          `;
          eventsContainer.appendChild(node);
        });
    };

    const renderStatus = status => {
      statusPanel.hidden = false;
      stageLabel.textContent = prettyStage(status.stage);
      stageLabel.dataset.state = status.stage;
      updatedAt.textContent = formatTimestamp(status.updated_at);

      if (status.error) {
        errorBanner.hidden = false;
        errorBanner.textContent = status.error;
      } else {
        errorBanner.hidden = true;
      }

      if (status.result_paths?.length) {
        resultsBlock.hidden = false;
        resultList.innerHTML = '';
        status.result_paths.forEach(path => {
          const li = document.createElement('li');
          li.textContent = path;
          resultList.appendChild(li);
        });
      } else {
        resultsBlock.hidden = true;
      }
    };

    const fetchStatusAndEvents = async sessionId => {
      try {
        const [statusRes, eventsRes] = await Promise.all([
          fetch(`${API_BASE}/sessions/${sessionId}`),
          fetch(`${API_BASE}/sessions/${sessionId}/events`)
        ]);

        if (!statusRes.ok) {
          throw new Error(`Status request failed: ${statusRes.status}`);
        }
        if (!eventsRes.ok) {
          throw new Error(`Events request failed: ${eventsRes.status}`);
        }

        const status = await statusRes.json();
        const events = await eventsRes.json();

        renderStatus(status);
        renderEvents(events);

        if (status.completed) {
          stopPolling();
        }
      } catch (error) {
        errorBanner.hidden = false;
        errorBanner.textContent = error.message;
      }
    };

    const startPolling = () => {
      const sessionId = sessionIdInput.value.trim();
      if (!sessionId) {
        alert('Enter a session ID first.');
        return;
      }

      eventsContainer.innerHTML = '';
      errorBanner.hidden = true;
      statusPanel.hidden = true;
      resultsBlock.hidden = true;

      startBtn.disabled = true;
      stopBtn.disabled = false;
      sessionIdInput.disabled = true;

      fetchStatusAndEvents(sessionId);
      pollHandle = setInterval(() => fetchStatusAndEvents(sessionId), POLL_INTERVAL);
    };

    const stopPolling = () => {
      if (pollHandle) {
        clearInterval(pollHandle);
        pollHandle = null;
      }
      startBtn.disabled = false;
      stopBtn.disabled = true;
      sessionIdInput.disabled = false;
    };

    startBtn.addEventListener('click', startPolling);
    stopBtn.addEventListener('click', stopPolling);
  </script>
</body>
</html>
